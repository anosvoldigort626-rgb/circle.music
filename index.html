<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Studio Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-blue-dark: #0056b3;
            --ios-red: #FF3B30;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 20px 40px rgba(0,0,0,0.1);
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        input { user-select: text; }

        body {
            background: radial-gradient(circle at top right, #c2e59c 0%, #64b3f4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-window {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 950px;
            min-height: 85vh; /* Увеличенная высота для ПК */
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка и Вкладки */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.2);
        }

        .tabs {
            display: flex;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 4px;
        }

        .tab-btn {
            padding: 8px 20px;
            border-radius: 10px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--text-main);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .reset-btn {
            background: rgba(255, 59, 48, 0.1);
            color: var(--ios-red);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        /* Тело приложения */
        .app-body {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 30px;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .app-body {
                flex-direction: row;
            }
            .left-panel { flex: 1; display: flex; flex-direction: column; }
            .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        }

        /* Левая панель */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .upload-zone {
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed rgba(0, 122, 255, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            flex-grow: 1; /* Растягивает на всю высоту */
            min-height: 200px;
        }

        .upload-zone:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--ios-blue);
        }

        .upload-icon {
            width: 50px; height: 50px;
            fill: none; stroke: var(--ios-blue);
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            margin-bottom: 15px;
        }

        /* Обложка */
        .media-preview-container {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1/1;
            margin: 0 auto;
            display: none;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            background: #eee;
        }

        .media-preview-container.video-mode {
            aspect-ratio: 16/9;
            max-width: 100%;
        }

        #coverPreview {
            width: 100%; height: 100%;
            border-radius: 20px;
            object-fit: cover;
        }

        /* SVG Кнопка камеры */
        .camera-btn {
            position: absolute;
            bottom: -15px; right: -15px;
            background: #fff;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
            color: var(--text-main);
            transition: transform 0.2s;
        }

        .camera-btn:hover { transform: scale(1.1); }
        .camera-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Плеер */
        .player-box {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: linear-gradient(135deg, var(--ios-blue), var(--ios-blue-dark));
            border: none;
            width: 42px; height: 42px;
            border-radius: 50%;
            color: white;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
            transition: 0.2s;
        }
        
        .control-btn.stop {
            background: linear-gradient(135deg, #ff4b4b, #c41818);
            box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3);
        }

        .control-btn:active { transform: scale(0.9); }
        .control-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .progress-bar-bg {
            flex-grow: 1; height: 6px;
            background: rgba(0,0,0,0.1);
            border-radius: 3px; cursor: pointer; position: relative;
        }

        .progress-bar-fill {
            position: absolute; left: 0; top: 0;
            height: 100%; width: 0%;
            background: var(--ios-blue); border-radius: 3px;
        }

        /* Правая панель (Инпуты) */
        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: var(--text-muted); margin-bottom: 6px; margin-left: 5px; text-transform: uppercase;
        }

        .custom-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid transparent;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 16px;
            color: var(--text-main);
            outline: none; transition: 0.3s;
        }

        .custom-input:focus {
            background: #fff;
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .save-btn-master {
            background: linear-gradient(135deg, var(--ios-blue), var(--ios-blue-dark));
            color: white; border: none; width: 100%; padding: 18px;
            border-radius: 18px; font-size: 18px; font-weight: 600;
            cursor: pointer; margin-top: 10px;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
            transition: all 0.2s;
        }

        .save-btn-master:active { transform: scale(0.97); }

        #fileInput, #artInput { display: none; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="app-header">
        <div class="tabs">
            <button class="tab-btn active" id="tabMusic" onclick="switchTab('music')">Музыка</button>
            <button class="tab-btn" id="tabVideo" onclick="switchTab('video')">Видео</button>
        </div>
        <button class="reset-btn" id="resetBtn" onclick="resetApp()">Очистить всё</button>
    </div>

    <input type="file" id="fileInput" accept="audio/mpeg" multiple>
    <input type="file" id="artInput" accept="image/*">

    <div class="app-body">
        <div class="left-panel">
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <svg class="upload-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <p id="uploadTitle" style="font-weight: 600; font-size: 18px;">Загрузить MP3</p>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">Нажмите для выбора файлов</p>
            </div>

            <div class="media-preview-container" id="mediaContainer">
                <img id="coverPreview" src="" alt="Обложка">
                <div class="camera-btn" onclick="document.getElementById('artInput').click()">
                    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </div>
            </div>

            <div class="player-box" id="playerBox">
                <button class="control-btn" id="playBtn" onclick="togglePlay()">
                    <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button class="control-btn stop" id="stopBtn" onclick="stopAudio()">
                    <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"></rect></svg>
                </button>
                <div class="progress-bar-bg" id="progressBg" onclick="seekAudio(event)">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>
        </div>

        <div class="right-panel" id="editorSection" style="display: none;">
            <div class="input-group">
                <label id="lblTitle">Название трека</label>
                <input type="text" id="title" class="custom-input" placeholder="Введите название...">
            </div>
            <div class="input-group" id="groupArtist">
                <label>Артист</label>
                <input type="text" id="artist" class="custom-input" placeholder="Имя исполнителя...">
            </div>
            <div class="input-group" id="groupAlbum">
                <label>Альбом</label>
                <input type="text" id="album" class="custom-input" placeholder="Название альбома...">
            </div>

            <button class="save-btn-master" id="saveBtn" onclick="processSave()">Сохранить изменения</button>
        </div>
    </div>
</div>

<script>
    let mode = 'music'; // 'music' или 'video'
    let filesData = []; 
    let currentArtBuffer = null;
    let currentArtType = null;
    let mediaEl = new Audio();
    
    // Элементы
    const fileInput = document.getElementById('fileInput');
    const artInput = document.getElementById('artInput');
    const uploadZone = document.getElementById('uploadZone');
    const mediaContainer = document.getElementById('mediaContainer');
    const coverPreview = document.getElementById('coverPreview');
    const playerBox = document.getElementById('playerBox');
    const editorSection = document.getElementById('editorSection');
    const resetBtn = document.getElementById('resetBtn');
    const uploadTitle = document.getElementById('uploadTitle');

    // SVG Иконки для плеера
    const iconPlay = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
    const iconPause = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

    function switchTab(newMode) {
        if(filesData.length > 0) resetApp();
        mode = newMode;
        
        document.getElementById('tabMusic').classList.toggle('active', mode === 'music');
        document.getElementById('tabVideo').classList.toggle('active', mode === 'video');
        
        if(mode === 'music') {
            fileInput.accept = "audio/mpeg";
            uploadTitle.innerText = "Загрузить MP3";
            document.getElementById('lblTitle').innerText = "Название трека";
            document.getElementById('groupArtist').style.display = 'block';
            document.getElementById('groupAlbum').style.display = 'block';
            mediaContainer.classList.remove('video-mode');
        } else {
            fileInput.accept = "video/mp4,video/webm,video/quicktime";
            uploadTitle.innerText = "Загрузить Видео";
            document.getElementById('lblTitle').innerText = "Название видео";
            document.getElementById('groupArtist').style.display = 'none';
            document.getElementById('groupAlbum').style.display = 'none';
            mediaContainer.classList.add('video-mode');
        }
    }

    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        filesData = [];
        uploadZone.style.display = 'none';
        mediaContainer.style.display = 'block';
        editorSection.style.display = 'flex';
        resetBtn.style.display = 'block';

        if(mode === 'music') {
            playerBox.style.display = 'flex';
        }

        for (let file of files) {
            const buffer = await file.arrayBuffer();
            filesData.push({ file, buffer, name: file.name });
        }

        if(mode === 'music') {
            loadAudioPreview(files[0]);
        } else {
            loadVideoPreview(files[0]);
        }
    });

    function loadAudioPreview(file) {
        jsmediatags.read(file, {
            onSuccess: (tag) => {
                const t = tag.tags;
                document.getElementById('title').value = t.title || "";
                document.getElementById('artist').value = t.artist || "";
                document.getElementById('album').value = t.album || "";

                if (t.picture) {
                    try {
                        const byteArray = new Uint8Array(t.picture.data);
                        const blob = new Blob([byteArray], { type: t.picture.format });
                        coverPreview.src = URL.createObjectURL(blob);
                        currentArtBuffer = byteArray.buffer;
                    } catch (e) { coverPreview.src = ""; }
                }
            }
        });
        mediaEl.src = URL.createObjectURL(file);
    }

    function loadVideoPreview(file) {
        document.getElementById('title').value = file.name.split('.')[0];
        // Для видео создаем временный элемент, чтобы вытащить кадр, или просто показываем серый фон
        coverPreview.src = ""; 
        coverPreview.style.background = "#333";
    }

    // Смена обложки
    artInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
            currentArtType = file.type;
            currentArtBuffer = await file.arrayBuffer();
            const blob = new Blob([currentArtBuffer], { type: file.type });
            coverPreview.src = URL.createObjectURL(blob);
            coverPreview.style.background = "transparent";
        }
    };

    // Плеер
    function togglePlay() {
        if (!mediaEl.src) return;
        if (mediaEl.paused) {
            mediaEl.play();
            document.getElementById('playIcon').innerHTML = iconPause;
        } else {
            mediaEl.pause();
            document.getElementById('playIcon').innerHTML = iconPlay;
        }
    }

    function stopAudio() {
        if (!mediaEl.src) return;
        mediaEl.pause();
        mediaEl.currentTime = 0;
        document.getElementById('playIcon').innerHTML = iconPlay;
    }

    mediaEl.ontimeupdate = () => {
        if (mediaEl.duration) {
            document.getElementById('progressBar').style.width = ((mediaEl.currentTime / mediaEl.duration) * 100) + "%";
        }
    };

    function seekAudio(e) {
        const rect = e.target.getBoundingClientRect();
        mediaEl.currentTime = ((e.clientX - rect.left) / rect.width) * mediaEl.duration;
    }

    mediaEl.onended = stopAudio;

    function resetApp() {
        stopAudio();
        mediaEl.src = "";
        filesData = []; currentArtBuffer = null;
        fileInput.value = ""; artInput.value = "";
        document.getElementById('title').value = "";
        document.getElementById('artist').value = "";
        document.getElementById('album').value = "";
        
        uploadZone.style.display = 'flex';
        mediaContainer.style.display = 'none';
        playerBox.style.display = 'none';
        editorSection.style.display = 'none';
        resetBtn.style.display = 'none';
    }

    async function processSave() {
        if (filesData.length === 0) return;
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Обработка...";
        btn.disabled = true;

        if (mode === 'music') {
            // Логика сохранения MP3
            for (let item of filesData) {
                const writer = new ID3Writer(item.buffer);
                writer.setFrame('TIT2', document.getElementById('title').value || item.name)
                      .setFrame('TPE1', [document.getElementById('artist').value])
                      .setFrame('TALB', document.getElementById('album').value);

                if (currentArtBuffer) writer.setFrame('APIC', { type: 3, data: currentArtBuffer, description: 'Cover' });
                writer.addTag();
                
                downloadFile(writer.getBlob(), "edit_" + item.name);
            }
        } else {
            // Логика для видео (имитация/ограничение браузера)
            alert("Важно: Изменение тегов и обложек MP4 файлов полностью внутри браузера технически ограничено (требуется сервер или FFmpeg). Видео будет скачано в исходном виде, но интерфейс работает корректно.");
            
            for (let item of filesData) {
                const blob = new Blob([item.buffer], { type: item.file.type });
                downloadFile(blob, "edit_" + item.name);
            }
        }

        setTimeout(() => {
            btn.innerText = "Сохранить изменения";
            btn.disabled = false;
        }, 1500);
    }

    function downloadFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
</script>

</body>
</html>
