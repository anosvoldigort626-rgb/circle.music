<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Music Studio Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-blue-dark: #0056b3;
            --ios-red: #FF3B30;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 20px 40px rgba(0,0,0,0.08);
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
        }

        /* Запрет выделения текста для всего UI */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
            user-select: none; /* Standard */
            -webkit-tap-highlight-color: transparent;
        }

        /* Исключение для полей ввода — там текст выделять можно */
        input {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        body {
            background: radial-gradient(circle at top left, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-window {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 900px; /* Увеличено для ПК */
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* Шапка приложения */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .app-header h1 {
            font-size: 20px;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .reset-btn {
            background: rgba(255, 59, 48, 0.1);
            color: var(--ios-red);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: none; /* Скрыто до загрузки */
        }

        .reset-btn:hover {
            background: rgba(255, 59, 48, 0.2);
        }
        
        .reset-btn:active {
            transform: scale(0.95);
        }

        /* Двухколоночный макет */
        .app-body {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding: 30px;
        }

        /* На ПК делаем две колонки */
        @media (min-width: 768px) {
            .app-body {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Левая колонка (Файлы и Плеер) */
        .upload-zone {
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed rgba(0, 122, 255, 0.3);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .upload-zone:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--ios-blue);
        }

        .cover-section {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
            display: none;
        }

        #coverPreview {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            background: #eee;
            transition: 0.4s ease-out;
        }

        .edit-cover-btn {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 20px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .edit-cover-btn:hover {
            transform: scale(1.1);
        }

        /* Плеер */
        .player-box {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .play-btn {
            background: linear-gradient(135deg, var(--ios-blue), var(--ios-blue-dark));
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
            transition: 0.2s;
        }
        
        .play-btn:active { transform: scale(0.9); }

        .progress-bar-bg {
            flex-grow: 1;
            height: 6px;
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--ios-blue);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .file-list-box {
            max-height: 120px;
            overflow-y: auto;
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 10px;
            display: none;
        }

        .file-item {
            font-size: 13px;
            color: var(--text-main);
            padding: 5px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item:last-child { border: none; }

        /* Правая колонка (Редактор) */
        .editor-section {
            display: none;
            flex-direction: column;
            justify-content: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-left: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid transparent;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .custom-input:focus {
            background: #fff;
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .save-btn-master {
            background: linear-gradient(135deg, var(--ios-blue), var(--ios-blue-dark));
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .save-btn-master:hover {
            box-shadow: 0 15px 25px rgba(0, 122, 255, 0.4);
            transform: translateY(-2px);
        }

        .save-btn-master:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 5px 10px rgba(0, 122, 255, 0.3);
        }

        .save-btn-master:disabled {
            background: #b0c4de;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #fileInput, #artInput { display: none; }
    </style>
</head>
<body>

<div class="app-window">
    <div class="app-header">
        <h1>Music Studio</h1>
        <button class="reset-btn" id="resetBtn">Очистить всё</button>
    </div>

    <input type="file" id="fileInput" accept="audio/mpeg" multiple>
    <input type="file" id="artInput" accept="image/*">

    <div class="app-body">
        <div class="left-panel">
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--ios-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <p style="font-weight: 600; font-size: 16px; color: var(--text-main);">Загрузить MP3</p>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">Можно выбрать несколько файлов</p>
            </div>

            <div class="cover-section" id="coverSection">
                <img id="coverPreview" src="" alt="Обложка">
                <div class="edit-cover-btn" onclick="document.getElementById('artInput').click()">📷</div>
            </div>

            <div class="player-box" id="playerBox">
                <button class="play-btn" id="playBtn">▶</button>
                <div class="progress-bar-bg" id="progressBg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="file-list-box" id="fileListBox"></div>
        </div>

        <div class="editor-section" id="editorSection">
            <div class="input-group">
                <label>Название трека</label>
                <input type="text" id="title" class="custom-input" placeholder="Введите название..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>Артист</label>
                <input type="text" id="artist" class="custom-input" placeholder="Имя исполнителя..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>Альбом</label>
                <input type="text" id="album" class="custom-input" placeholder="Название альбома..." autocomplete="off">
            </div>

            <button class="save-btn-master" id="saveBtn">Сохранить изменения</button>
        </div>
    </div>
</div>

<script>
    // Состояния приложения
    let filesData = []; 
    let currentArtBuffer = null;
    let audio = new Audio();
    
    // Элементы DOM
    const fileInput = document.getElementById('fileInput');
    const artInput = document.getElementById('artInput');
    const uploadZone = document.getElementById('uploadZone');
    const coverSection = document.getElementById('coverSection');
    const coverPreview = document.getElementById('coverPreview');
    const playerBox = document.getElementById('playerBox');
    const fileListBox = document.getElementById('fileListBox');
    const editorSection = document.getElementById('editorSection');
    const resetBtn = document.getElementById('resetBtn');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const saveBtn = document.getElementById('saveBtn');

    // 1. Загрузка файлов
    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        // Переключаем интерфейс
        uploadZone.style.display = 'none';
        coverSection.style.display = 'block';
        playerBox.style.display = 'flex';
        editorSection.style.display = 'flex';
        resetBtn.style.display = 'block';
        
        if (files.length > 1) {
            fileListBox.style.display = 'block';
            document.getElementById('title').placeholder = "(Разные названия - оставьте пустым)";
        }

        filesData = [];
        fileListBox.innerHTML = "";
        
        for (let file of files) {
            const buffer = await file.arrayBuffer();
            filesData.push({ file, buffer, name: file.name });
            fileListBox.innerHTML += `<div class="file-item">🎵 ${file.name}</div>`;
        }

        // Читаем первый файл для предпросмотра
        loadPreview(files[0]);
    });

    // 2. Чтение тегов и обложки (Исправленный безопасный метод)
    function loadPreview(file) {
        jsmediatags.read(file, {
            onSuccess: (tag) => {
                const t = tag.tags;
                
                // Заполняем поля только если загружен один файл
                if (filesData.length === 1) {
                    document.getElementById('title').value = t.title || "";
                } else {
                    document.getElementById('title').value = ""; // Очищаем для пакетного
                }
                
                document.getElementById('artist').value = t.artist || "";
                document.getElementById('album').value = t.album || "";

                // Безопасное извлечение картинки (без ошибки переполнения стека)
                if (t.picture) {
                    try {
                        const { data, format } = t.picture;
                        const byteArray = new Uint8Array(data);
                        const blob = new Blob([byteArray], { type: format });
                        const imageUrl = URL.createObjectURL(blob);
                        
                        coverPreview.src = imageUrl;
                        currentArtBuffer = byteArray.buffer;
                    } catch (err) {
                        console.error("Ошибка загрузки картинки", err);
                        coverPreview.src = "";
                    }
                } else {
                    coverPreview.src = "";
                    currentArtBuffer = null;
                }
            },
            onError: (err) => {
                console.warn("Теги не найдены", err);
                coverPreview.src = "";
            }
        });
        
        // Подключаем аудио к плееру
        audio.src = URL.createObjectURL(file);
        audio.load();
    }

    // 3. Управление плеером
    playBtn.onclick = () => {
        if (!audio.src) return;
        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸";
        } else {
            audio.pause();
            playBtn.innerText = "▶";
        }
    };

    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = pct + "%";
        }
    };

    // Перемотка
    document.getElementById('progressBg').onclick = (e) => {
        const rect = e.target.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const pct = clickX / width;
        audio.currentTime = pct * audio.duration;
    };

    audio.onended = () => {
        playBtn.innerText = "▶";
        progressBar.style.width = "0%";
    };

    // 4. Загрузка новой обложки
    artInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
            currentArtBuffer = await file.arrayBuffer();
            const blob = new Blob([currentArtBuffer], { type: file.type });
            coverPreview.src = URL.createObjectURL(blob);
        }
    };

    // 5. Очистка процесса (Reset)
    resetBtn.onclick = () => {
        // Останавливаем музыку
        audio.pause();
        audio.src = "";
        
        // Очищаем данные
        filesData = [];
        currentArtBuffer = null;
        fileInput.value = "";
        artInput.value = "";
        
        // Очищаем поля
        document.getElementById('title').value = "";
        document.getElementById('artist').value = "";
        document.getElementById('album').value = "";
        coverPreview.src = "";
        
        // Сбрасываем плеер
        playBtn.innerText = "▶";
        progressBar.style.width = "0%";
        
        // Переключаем интерфейс обратно
        uploadZone.style.display = 'flex';
        coverSection.style.display = 'none';
        playerBox.style.display = 'none';
        editorSection.style.display = 'none';
        resetBtn.style.display = 'none';
        fileListBox.style.display = 'none';
    };

    // 6. Сохранение (Batch/Single)
    saveBtn.onclick = async () => {
        if (filesData.length === 0) return;

        if (navigator.vibrate) navigator.vibrate(50);
        
        saveBtn.innerText = "Обработка...";
        saveBtn.disabled = true;

        const titleVal = document.getElementById('title').value;
        const artistVal = document.getElementById('artist').value;
        const albumVal = document.getElementById('album').value;

        try {
            for (let item of filesData) {
                const writer = new ID3Writer(item.buffer);
                
                // Если редактируем 1 файл - берем title. Если несколько - оставляем оригинальные имена, если title пуст
                const finalTitle = (filesData.length === 1) ? titleVal : (titleVal || item.name.replace('.mp3', ''));
                
                writer.setFrame('TIT2', finalTitle)
                      .setFrame('TPE1', [artistVal])
                      .setFrame('TALB', albumVal);

                if (currentArtBuffer) {
                    writer.setFrame('APIC', { 
                        type: 3, 
                        data: currentArtBuffer, 
                        description: 'Cover' 
                    });
                }

                writer.addTag();
                const blob = writer.getBlob();
                const url = URL.createObjectURL(blob);
                
                // Триггер скачивания
                const a = document.createElement('a');
                a.href = url;
                a.download = "edit_" + item.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // Небольшая задержка, чтобы браузер не заблокировал массовое скачивание
                await new Promise(r => setTimeout(r, 300)); 
            }
            
            saveBtn.innerText = "Успешно!";
        } catch (err) {
            console.error(err);
            saveBtn.innerText = "Ошибка сохранения";
        }

        setTimeout(() => {
            saveBtn.innerText = "Сохранить изменения";
            saveBtn.disabled = false;
        }, 2000);
    };
</script>

</body>
</html>
